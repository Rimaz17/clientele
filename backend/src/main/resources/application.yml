server:
  port: 8080
  # Spring's fallback /error response must not leak internals. API errors are
  # rendered by DefaultExceptionHandler instead.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

clientele:
  jwt:
    # No secret here on purpose: it comes from application-dev.yml locally and
    # from the CLIENTELE_JWT_SECRET environment variable everywhere else.
    issuer: clientele
    expiration: 15d

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"

aws:
  region: eu-west-1
  s3:
    mock: true
    buckets:
      customer: fs-amigoscode-customer-test

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

springdoc:
  # Each endpoint documents the errors it can return. Without this, springdoc
  # adds the response of every @ExceptionHandler to every operation.
  override-with-generic-response: false
  # Documents the public health and info endpoints next to the API.
  show-actuator: true
  swagger-ui:
    # Swagger UI at /swagger-ui/index.html. Turn it off with
    # SPRINGDOC_SWAGGERUI_ENABLED=false; /v3/api-docs stays available.
    enabled: true
    # Groups in alphabetical order, which puts Authentication first, and each
    # group's operations by path, so the list and sign-up come before the
    # single-customer operations.
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  profiles:
    # Local runs and tests use the dev profile unless a profile is set explicitly.
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5332/customer
    username: amigoscode
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  codec:
    max-in-memory-size: 10MB