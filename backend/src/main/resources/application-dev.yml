# Development profile, active by default when no other profile is set
# (see spring.profiles.default in application.yml).

clientele:
  jwt:
    # DEVELOPMENT ONLY. Never use this value in any shared or deployed environment.
    # Other environments must provide CLIENTELE_JWT_SECRET instead.
    secret: "dev-only-5J/WxfbC+zvOPVM0WprSw5F5EZUWPxfB9eYqJBS/FuRzwcONgxOz0G0DwhTmLrOQ"
  seed:
    # Adds demo customers on startup (see DevDataSeeder).
    enabled: true
  bootstrap:
    admin:
      # DEVELOPMENT ONLY admin account, documented in the README. Other
      # environments get an admin only from CLIENTELE_BOOTSTRAP_ADMIN_EMAIL and
      # CLIENTELE_BOOTSTRAP_ADMIN_PASSWORD.
      email: admin@clientele.dev
      password: admin-password
